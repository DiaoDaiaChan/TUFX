// TUFX Next-Gen Cinematic Profile with Advanced Effects
TUFX_PROFILE
{
	name = Cinematic-NextGen-Flight
	hdr = True
	antialiasing = TemporalAntialiasing
	secondaryAntialiasing = FastApproximateAntialiasing

	EFFECT
	{
		name = ContrastAdaptiveSharpening
		Sharpness = 0.55
	}
	EFFECT
	{
		name = ModernTonemapping
		Tonemapper = ACES
		Exposure = 1.05
		Contrast = 1.25
		Saturation = 1.05
	}
	EFFECT
	{
		name = GroundTruthAO
		Radius = 1.2
		Intensity = 1.5
		Thickness = 1.0
		MultiBounce = 0.5
	}
	EFFECT
	{
		name = ContactShadows
		RayLength = 0.15
		RaySteps = 8
		Intensity = 0.65
		Thickness = 0.03
	}
	EFFECT
	{
		name = Halation
		Intensity = 0.85
		Threshold = 1.3
		Radius = 2.2
		ColorTint = 1.0, 0.36, 0.12, 1.0
	}
	EFFECT
	{
		name = AnamorphicFlare
		StreakIntensity = 0.8
		StreakLength = 3.5
		StreakColor = 0.15, 0.60, 1.0, 1.0
		SpikeIntensity = 0.0
		SpikeCount = 6
		SpikeLength = 3.0
		GhostIntensity = 0.0
		Threshold = 2.5
		SoftKnee = 0.25
		Letterbox = False
		LetterboxRatio = 2.39
	}
	EFFECT
	{
		name = Bloom
		Intensity = 1.5
		SoftKnee = 0.65
		Threshold = 1.0
	}
	EFFECT
	{
		name = ScreenSpaceReflections
		Preset = Medium
		MaxIterationCount = 24
		Resolution = Downsampled
		Thickness = 8
		MaxMarchDistance = 150
		DistanceFade = 0.5
		Vignette = 0.5
	}
}

