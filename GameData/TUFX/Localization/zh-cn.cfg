        #LOC_TUFX_Desc_CAS = <size=10><color=grey>基于 AMD FidelityFX 的自适应对比度锐化，大幅恢复纹理高频细节，且绝不产生边缘振铃光晕。</color></size>
        #LOC_TUFX_Desc_ModernTonemapping = <size=10><color=grey>支持 ACES、AgX、Filmic 与 Tony McMapface 等次世代胶片色调映射算子，提供宽广的动态范围与自然的过曝饱和度滚降。</color></size>
        #LOC_TUFX_Desc_GTAO = <size=10><color=grey>英特尔物理真值环境光遮蔽 (GTAO)，具备多重弹射漫反射补偿与高光反射物理遮蔽，让航天器结构层次分明。</color></size>
        #LOC_TUFX_Desc_ContactShadows = <size=10><color=grey>屏幕空间光线步进微阴影，精准捕捉蒙皮缝隙、级间分离器、起落架及微小结构间的高精度接触自阴影。</color></size>
        #LOC_TUFX_Desc_SSGI = <size=10><color=grey>屏幕空间漫反射单次弹射全局照明与色溢，让火箭各部件及周围地面呈现真实逼真的二次环境反弹光照。</color></size>
        #LOC_TUFX_Desc_SSSS = <size=10><color=grey>可分离次表面散射，自动识别表面材质色度：金属卫星保持纯净中性冷光，坎巴拉宇航员获得透润的绿色皮下微光。</color></size>
        #LOC_TUFX_Desc_GodRays = <size=10><color=grey>基于解析日冕与天体遮挡的体积光束，在大气层与太空深空均能呈现壮美逼真的太阳散射神光。</color></size>
        #LOC_TUFX_Desc_Halation = <size=10><color=grey>纯正的 35mm 模拟胶片光晕，在高反差强光源与高光边缘呈现柔和温暖的经典红橙色晕光漫溢。</color></size>
        #LOC_TUFX_Desc_AnamorphicFlare = <size=10><color=grey>好莱坞宽银幕变形镜头炫光：横贯全屏的电光蓝拉丝、白炽光芯、星芒衍射及 2.39:1 CinemaScope 电影黑边遮幅。</color></size>
        #LOC_TUFX_Desc_HeatDistortion = <size=10><color=grey>基于屏幕法线的大气热浪湍流、发动机喷管热空气扭曲及高超音速大气再入激波压缩畸变。</color></size>
        #LOC_TUFX_Desc_CameraMotionBlur = <size=10><color=grey>采用物理相机旋转快门开角机制的电影级速度感与视角旋转运动模糊。</color></size>
        #LOC_TUFX_Desc_AntiFlicker = <size=10><color=grey>业界标准 Brian Karis (UE5) 时间方差裁剪与反亮度加权技术。彻底消除细天线、桁架与亚像素高对比度边缘的剧烈闪烁，同时保持飞船机体 100% 锐利。</color></size>
        #LOC_TUFX_Desc_CMAA2 = <size=10><color=grey>英特尔先进形态学抗锯齿算法。超锐利边缘抗锯齿平滑，无时间性拖影或模糊。</color></size>
        #LOC_TUFX_Desc_FSR = <size=10><color=grey>AMD FSR 1.0 边缘自适应空间超采样 (EASU)，12 抽头方向重构。以 50%~77% 亚原生分辨率渲染大幅提升帧率，同时保持锋利几何边缘。</color></size>
        #LOC_TUFX_Desc_SpectralBokeh = <size=10><color=grey>物理模拟光学色差散景景深，支持准星自动跟踪、彩虹边缘色散与 2x 好莱坞椭圆大光圈散景。</color></size>

