TUFX_PROFILE
{
	name = Default-Empty
	//NOOP - nothing enabled in empty
}
TUFX_PROFILE
{
	name = Default-Editor
	hdr = True
	antialiasing = FastApproximateAntialiasing // the editor has weird artifacts with TAA; it doesn't seem to support the off-center projection and there's bad ghosting
	EFFECT
	{
		name = GroundTruthAO
		Radius = 1.0
		Intensity = 1.0
		Thickness = 0.8
		MultiBounce = 0.5
		SpecularOcclusion = 0.6
	}
	EFFECT
	{
		name = AutoExposure
	}
	EFFECT
	{
		name = Bloom
		Intensity = 2
		SoftKnee = 0.65
	}
}

