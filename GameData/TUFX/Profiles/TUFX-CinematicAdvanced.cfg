// TUFX Next-Gen Cinematic Profile with Advanced Effects
TUFX_PROFILE
{
	name = Cinematic-NextGen-Flight
	hdr = True
	antialiasing = TemporalAntialiasing
	secondaryAntialiasing = FastApproximateAntialiasing

	EFFECT
	{
		name = ContrastAdaptiveSharpening
		Sharpness = 0.55
	}
	EFFECT
	{
		name = ModernTonemapping
		Tonemapper = AgX
		Exposure = 1.0
		Saturation = 1.05
	}
	EFFECT
	{
		name = GroundTruthAO
		Radius = 1.2
		Intensity = 1.5
		Thickness = 1.0
		MultiBounce = 0.5
		MaxDistance = 150
		FadeRange = 30
	}
	EFFECT
	{
		name = ContactShadows
		RayLength = 0.15
		RaySteps = 8
		Intensity = 0.65
		Thickness = 0.03
		MaxDistance = 50
		FadeRange = 10
	}
	EFFECT
	{
		name = Halation
		Intensity = 0.85
		Threshold = 1.3
		Radius = 2.2
		ColorTint = 1.0, 0.36, 0.12, 1.0
	}
	EFFECT
	{
		name = AnamorphicFlare
		StreakIntensity = 0.7
		StreakLength = 3.5
		StreakColor = 0.35, 0.75, 1.0, 1.0
		SpikeIntensity = 0.6
		SpikeCount = 6
		SpikeLength = 3.0
		Threshold = 2.0
	}
	EFFECT
	{
		name = GodRays
		Intensity = 0.8
		Density = 0.85
		Decay = 0.95
		Weight = 0.35
		RayColor = 1.0, 0.96, 0.88, 1.0
	}
	EFFECT
	{
		name = Bloom
		Intensity = 1.5
		SoftKnee = 0.65
		Threshold = 1.0
	}
	EFFECT
	{
		name = AutoExposure
	}
	EFFECT
	{
		name = ScreenSpaceReflections
		Preset = Medium
		MaxIterationCount = 24
		Resolution = Downsampled
		Thickness = 8
		MaxMarchDistance = 150
		DistanceFade = 0.5
		Vignette = 0.5
	}
}
