        // Descriptions
        #LOC_TUFX_Desc_CAS = <size=10><color=grey>AMD FidelityFX Contrast Adaptive Sharpening. Restores high-frequency clarity without ringing artifacts.</color></size>
        #LOC_TUFX_Desc_ModernTonemapping = <size=10><color=grey>ACES, AgX, and Filmic HDR tonemapping curves with wide dynamic range and natural saturation roll-off.</color></size>
        #LOC_TUFX_Desc_GTAO = <size=10><color=grey>Intel Ground Truth Ambient Occlusion (GTAO) with multi-bounce ambient filling and specular reflection occlusion.</color></size>
        #LOC_TUFX_Desc_ContactShadows = <size=10><color=grey>Screen-space raymarching micro-contact shadows for panel seams, decouplers, and landing gear.</color></size>
        #LOC_TUFX_Desc_SSGI = <size=10><color=grey>Single-bounce screen-space diffuse indirect illumination & realistic color bleeding from terrain and nearby vehicle hulls.</color></size>
        #LOC_TUFX_Desc_SSSS = <size=10><color=grey>Separable screen-space subsurface scattering for organic Kerbal skin/EVA translucency. Auto Adapt dynamically matches scattering to surface albedo chrominance, keeping metallic spacecraft clean and neutral while giving Kerbals a rich green subcutaneous glow.</color></size>
        #LOC_TUFX_Desc_GodRays = <size=10><color=grey>Volumetric screen-space light shafts from the sun with planetary and spacecraft occlusions.</color></size>
        #LOC_TUFX_Desc_Halation = <size=10><color=grey>Authentic analog 35mm film halation red-orange glow bleeding around high-contrast overexposed edges.</color></size>
        #LOC_TUFX_Desc_AnamorphicFlare = <size=10><color=grey>Cinema anamorphic optical flares with horizontal spectral streaks, lens ghosts, diffraction starbursts, and cinematic letterbox black bars.</color></size>
        #LOC_TUFX_Desc_HeatDistortion = <size=10><color=grey>Atmospheric heat shimmer, engine plume thermal turbulence, and hypersonic reentry plasma distortion.</color></size>
        #LOC_TUFX_Desc_CameraMotionBlur = <size=10><color=grey>Cinematic camera and fast-action rotational motion blur using physical camera rotary shutter angle.</color></size>
        #LOC_TUFX_Desc_AntiFlicker = <size=10><color=grey>Industry-standard Brian Karis (UE5) YCoCg variance clipping & anti-firefly luma weighting. Eliminates high-frequency shimmering on trusses, wire antennas, and subpixel edges while keeping the spacecraft razor-sharp.</color></size>
        #LOC_TUFX_Desc_CMAA2 = <size=10><color=grey>Intel's state-of-the-art morphological AA algorithm. Extremely sharp edge smoothing without temporal ghosting or blur.</color></size>
        #LOC_TUFX_Desc_FSR = <size=10><color=grey>AMD FSR 1.0 Edge-Adaptive Spatial Upsampling (EASU) with 12-tap directional reconstruction. Renders at sub-native scale (50%~77%) for massive FPS gains while preserving razor-sharp geometry.</color></size>
        #LOC_TUFX_Desc_SpectralBokeh = <size=10><color=grey>Physically-simulated optical chromatic DoF with auto tracking, rainbow dispersion, and 2x Hollywood oval bokeh.</color></size>

