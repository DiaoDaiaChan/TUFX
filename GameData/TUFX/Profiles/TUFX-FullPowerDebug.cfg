// ==============================================================================
// TUFX Extreme Full-Power Debug Profile (All Extended Next-Gen Effects Enabled)
// ==============================================================================
// This profile enables EVERY advanced effect at optimal, debug-ready intensity.
// Switch to this profile in the TUFX in-game menu for immediate testing & showcase.
// ==============================================================================

TUFX_PROFILE
{
	name = TUFX-FullPower-Debug
	hdr = True
	antialiasing = TemporalAntialiasing
	secondaryAntialiasing = FastApproximateAntialiasing

	// 1. AMD FidelityFX Contrast Adaptive Sharpening (CAS)
	EFFECT
	{
		name = ContrastAdaptiveSharpening
		Sharpness = 0.60
	}

	// 2. Modern HDR ACES Filmic Tonemapping
	EFFECT
	{
		name = ModernTonemapping
		Tonemapper = ACES
		Exposure = 1.15
		Contrast = 1.25
		Saturation = 1.10
	}

	// 3. Ground Truth Ambient Occlusion (GTAO) with Multi-bounce & Specular Occlusion
	EFFECT
	{
		name = GroundTruthAO
		Radius = 1.8
		Intensity = 2.0
		Thickness = 1.2
		MultiBounce = 0.7
		SpecularOcclusion = 0.6
		Color = 0.0, 0.0, 0.0, 1.0
	}

	// 4. Micro-geometry Screen Space Contact Shadows
	EFFECT
	{
		name = ContactShadows
		RayLength = 0.20
		RaySteps = 12
		Intensity = 0.85
		Thickness = 0.04
	}

	// 5. Screen Space Global Illumination (SSGI) - 2-Pass Bilateral Smooth Diffuse Bounce
	EFFECT
	{
		name = SSGI
		Intensity = 1.5
		RayLength = 20.0
		Thickness = 0.8
		RayCount = 6
		RaySteps = 12
		BounceColor = 1.0, 1.0, 1.0, 1.0
	}

	// 6. Screen Space Subsurface Scattering (SSSS) - Auto-adaptive Skin/Material Translucency
	EFFECT
	{
		name = SubsurfaceScattering
		Intensity = 0.7
		ScatterRadius = 4.0
		DepthThreshold = 0.15
		MaxDistance = 350.0
		AutoAdapt = True
		SubsurfaceColor = 1.0, 0.92, 0.85, 1.0
	}

	// 7. Volumetric Screen Space God Rays (Solar Atmosphere & Orbit Light Shafts)
	EFFECT
	{
		name = GodRays
		Intensity = 0.85
		Threshold = 0.45
		Decay = 0.95
		Density = 0.85
		Weight = 0.25
		SpaceIntensity = 0.45
		RayColor = 1.0, 0.95, 0.85, 1.0
	}

	// 8. 35mm Analog Film Red/Orange Halation
	EFFECT
	{
		name = Halation
		Intensity = 1.0
		Threshold = 1.0
		Radius = 2.5
		ColorTint = 1.0, 0.35, 0.12, 1.0
	}

	// 9. Hollywood Anamorphic Flare with Full-Width Streak & 2.39:1 CinemaScope Letterbox
	EFFECT
	{
		name = AnamorphicFlare
		StreakIntensity = 1.2
		StreakLength = 3.5
		StreakColor = 0.15, 0.60, 1.0, 1.0
		SpikeIntensity = 0.6
		SpikeCount = 6
		SpikeLength = 3.5
		GhostIntensity = 0.6
		GhostSpread = 1.0
		GhostColor = 0.35, 0.75, 1.0, 1.0
		Dispersion = 0.8
		Threshold = 1.30
		SoftKnee = 0.15
		MaxBrightness = 30.0
		Letterbox = True
		LetterboxRatio = 2.39
	}

	// 10. Thermal Heat Wave Distortion (Plumes & Ground Atmospheric Shimmer)
	EFFECT
	{
		name = HeatDistortion
		Mode = AutoAdaptive
		Intensity = 0.85
		Speed = 3.0
		Scale = 12.0
		PlumeThreshold = 1.2
		GroundAltitudeLimit = 1200.0
	}

	// 11. Cinematic Rotary Shutter Camera Motion Blur
	EFFECT
	{
		name = CameraMotionBlur
		Mode = CameraAndObjects
		ShutterAngle = 200.0
		BlurMultiplier = 1.8
		SampleCount = 10
		MaxBlurPixels = 56.0
	}

	// 12. PBR Screen Space Reflections (SSR)
	EFFECT
	{
		name = ScreenSpaceReflections
		Preset = High
		MaxIterationCount = 32
		Resolution = Full
		Thickness = 6
		MaxMarchDistance = 250
		DistanceFade = 0.6
		Vignette = 0.5
	}

	// 13. High-Quality Optical Bloom
	EFFECT
	{
		name = Bloom
		Intensity = 1.3
		SoftKnee = 0.65
		Threshold = 0.95
	}

	// 14. Subtle Film Grain
	EFFECT
	{
		name = Grain
		Colored = True
		Intensity = 0.15
		Size = 1.0
		LumContrib = 0.8
	}

	// 15. Subtle Optical Vignette
	EFFECT
	{
		name = Vignette
		Intensity = 0.22
		Smoothness = 0.45
		Roundness = 1.0
	}
}
